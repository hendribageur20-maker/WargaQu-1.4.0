name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/WargaQu-v1.4.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WargaQu-v1.4.0-APK
          path: build-output/WargaQu-v1.4.0.apk
          retention-days: 30

      - name: Add APK Download Summary
        run: |
          echo "## 🎉 Berhasil Membuat APK WargaQu!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "File APK Android telah sukses di-build dan siap diunduh:" >> $GITHUB_STEP_SUMMARY
          echo "- **Nama File:** \`WargaQu-v1.4.0.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID:** \`com.wargaqu.app\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Versi Android Minimal:** Android 7.0 (API level 24+) s/d Android 15+" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 **Cara Download:** Buka tab **Summary** pada run GitHub Actions ini, lalu klik artifact **\`WargaQu-v1.4.0-APK\`** di bagian bawah." >> $GITHUB_STEP_SUMMARY
